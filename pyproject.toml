[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-trading-copilot"
version = "0.1.0"
description = "Subscription-list-driven AI trading copilot for US stocks and ETFs."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "chromadb>=0.5.0",
    "fastapi>=0.115.0",
    "futu-api>=10.4.6408",
    "langchain-core>=0.3.81",
    "langchain-openai>=0.3.23",
    "langgraph>=0.4.8",
    "langmem>=0.0.30",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "pandas>=2.3.0",
    "pydantic>=2.0.0",
    "python-dateutil>=2.9.0",
    "python-dotenv>=1.0.0",
    "questionary>=2.1.0",
    "requests>=2.32.4",
    "typing-extensions>=4.14.0",
    "uvicorn>=0.30.0",
    "yfinance>=0.2.63",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
]
eval = [
    "langchain-community<0.4",
    "ragas>=0.4.0",
    "rapidfuzz>=3.0.0",
]

[project.scripts]
ai-trading-copilot = "ai_trading_copilot.copilot.run:main"
ai-trading-copilot-ui = "ai_trading_copilot.copilot.ui.server:main"
ai-trading-copilot-rag = "ai_trading_copilot.copilot.rag:main"
ai-trading-copilot-eval = "ai_trading_copilot.copilot.evaluation:main"
ai-trading-copilot-memory = "ai_trading_copilot.copilot.memory:main"
ai-trading-copilot-memory-eval = "ai_trading_copilot.copilot.memory_eval:main"
ai-trading-copilot-harness-benchmark = "ai_trading_copilot.copilot.harness_benchmark:main"
ai-trading-copilot-harness = "ai_trading_copilot.copilot.harness_control:main"

[tool.setuptools]
package-dir = { "ai_trading_copilot" = "." }
packages = [
    "ai_trading_copilot",
    "ai_trading_copilot.copilot",
    "ai_trading_copilot.copilot.adapters",
    "ai_trading_copilot.copilot.agents",
    "ai_trading_copilot.copilot.analysis",
    "ai_trading_copilot.copilot.config",
    "ai_trading_copilot.copilot.domain",
    "ai_trading_copilot.copilot.graph",
    "ai_trading_copilot.copilot.services",
    "ai_trading_copilot.copilot.ui",
    "ai_trading_copilot.copilot.workflow",
]

[tool.setuptools.package-data]
ai_trading_copilot = [
    "config/*.json",
    "config/*.md",
    "config/prompts/*.md",
    "copilot/ui/static/*",
    "knowledge/fundamentals/*.md",
    "knowledge/stock_research/*.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --import-mode=importlib"
markers = [
    "unit: fast isolated unit tests",
    "integration: tests requiring external services",
    "smoke: quick sanity-check tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
